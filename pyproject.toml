[project]
name = "universal-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "python-multipart",
    "requests",
    "pymupdf",
    "python-docx",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "numpy",
    "langgraph",
    "langchain-core",
    "openai",
    "pgvector",
]

[tool.vercel]
entrypoint = "backend.main:app"